<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${flight.id == null ? 'Thêm chuyến bay mới' : 'Cập nhật chuyến bay'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f4f8;
        }
        .form-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .form-card .card-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            border-radius: 12px 12px 0 0;
            padding: 1.25rem 1.5rem;
        }
        .form-card .card-header h4 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .form-card .card-body {
            padding: 2rem;
        }
        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6c757d;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 0.4rem;
            margin-bottom: 1rem;
        }
        .form-label {
            font-weight: 500;
            color: #343a40;
        }
        .btn-save {
            min-width: 130px;
        }
    </style>
</head>
<body class="py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="card form-card">
                    <div class="card-header text-white d-flex align-items-center gap-2">
                        <i class="bi bi-airplane-fill fs-5"></i>
                        <h4 th:text="${flight.id == null ? 'Thêm chuyến bay mới' : 'Cập nhật chuyến bay'}"></h4>
                    </div>

                    <div class="card-body">
                        <form th:action="@{${flight.id == null ? '/flights/save' : '/flights/update'}}"
                              method="post"
                              th:object="${flight}">

                            <input type="hidden" th:field="*{id}">

                            <!-- Thông tin chuyến bay -->
                            <p class="section-label"><i class="bi bi-info-circle me-1"></i>Thông tin chuyến bay</p>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="flightCode" class="form-label">
                                        Mã chuyến bay <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" id="flightCode" th:field="*{flightCode}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('flightCode') ? ' is-invalid' : ''}"
                                           placeholder="VD: VN123">
                                    <div class="invalid-feedback" th:errors="*{flightCode}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="airline" class="form-label">
                                        Hãng hàng không <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" id="airline" th:field="*{airline}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('airline') ? ' is-invalid' : ''}"
                                           placeholder="VD: Vietnam Airlines">
                                    <div class="invalid-feedback" th:errors="*{airline}"></div>
                                </div>
                            </div>

                            <!-- Tuyến bay -->
                            <p class="section-label"><i class="bi bi-geo-alt me-1"></i>Tuyến bay</p>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="departureCity" class="form-label">
                                        Điểm khởi hành <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" id="departureCity" th:field="*{departureCity}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('departureCity') ? ' is-invalid' : ''}"
                                           placeholder="VD: Hà Nội">
                                    <div class="invalid-feedback" th:errors="*{departureCity}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="destinationCity" class="form-label">
                                        Điểm đến <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" id="destinationCity" th:field="*{destinationCity}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('destinationCity') ? ' is-invalid' : ''}"
                                           placeholder="VD: TP. Hồ Chí Minh">
                                    <div class="invalid-feedback" th:errors="*{destinationCity}"></div>
                                </div>
                            </div>

                            <!-- Thời gian -->
                            <p class="section-label"><i class="bi bi-clock me-1"></i>Thời gian</p>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="departureDate" class="form-label">
                                        Ngày khởi hành <span class="text-danger">*</span>
                                    </label>
                                    <input type="date" id="departureDate" th:field="*{departureDate}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('departureDate') ? ' is-invalid' : ''}">
                                    <div class="invalid-feedback" th:errors="*{departureDate}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="departureTime" class="form-label">
                                        Giờ khởi hành <span class="text-danger">*</span>
                                    </label>
                                    <input type="time" id="departureTime" th:field="*{departureTime}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('departureTime') ? ' is-invalid' : ''}">
                                    <div class="invalid-feedback" th:errors="*{departureTime}"></div>
                                </div>
                            </div>

                            <!-- Ghế & Giá -->
                            <p class="section-label"><i class="bi bi-ticket-perforated me-1"></i>Ghế &amp; Giá vé</p>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="totalSeats" class="form-label">
                                        Tổng số ghế <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" id="totalSeats" th:field="*{totalSeats}"
                                           class="form-control" min="1"
                                           th:classappend="${#fields.hasErrors('totalSeats') ? ' is-invalid' : ''}"
                                           placeholder="VD: 180">
                                    <div class="invalid-feedback" th:errors="*{totalSeats}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label for="availableSeats" class="form-label">
                                        Ghế còn trống <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" id="availableSeats" th:field="*{availableSeats}"
                                           class="form-control" min="0"
                                           th:classappend="${#fields.hasErrors('availableSeats') ? ' is-invalid' : ''}"
                                           placeholder="VD: 45">
                                    <div class="invalid-feedback" th:errors="*{availableSeats}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label for="price" class="form-label">
                                        Giá vé (VNĐ) <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" id="price" th:field="*{price}"
                                           class="form-control" min="0" step="1000"
                                           th:classappend="${#fields.hasErrors('price') ? ' is-invalid' : ''}"
                                           placeholder="VD: 1500000">
                                    <div class="invalid-feedback" th:errors="*{price}"></div>
                                </div>
                            </div>

                            <!-- Trạng thái -->
                            <div class="mb-4">
                                <label for="status" class="form-label">
                                    Trạng thái <span class="text-danger">*</span>
                                </label>
                                <select id="status" th:field="*{status}" class="form-select"
                                        th:classappend="${#fields.hasErrors('status') ? ' is-invalid' : ''}">
                                    <option value="">-- Chọn trạng thái --</option>
                                    <option value="Đúng giờ">Đúng giờ</option>
                                    <option value="Trễ giờ">Trễ giờ</option>
                                    <option value="Đã hủy">Đã hủy</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{status}"></div>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/flights}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>Quay lại
                                </a>
                                <button type="submit" class="btn btn-primary btn-save">
                                    <i class="bi bi-floppy me-1"></i>Lưu
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const totalSeatsInput = document.getElementById('totalSeats');
        const availableSeatsInput = document.getElementById('availableSeats');
        function updateAvailableMax() {
            const max = parseInt(totalSeatsInput.value, 10);
            if (!isNaN(max)) {
                availableSeatsInput.setAttribute('max', max);
            }
        }
        totalSeatsInput.addEventListener('input', updateAvailableMax);
        updateAvailableMax();
    </script>
</body>
</html>
